<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYPE TOWER</title>
  <link rel="icon" href="assets/images/rogo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section data-screen="home">
    <video class="home-bg-video" autoplay muted loop playsinline>
      <source src="assets/videos/menu-bg.mp4" type="video/mp4">
    </video>
    <div class="home-shade" aria-hidden="true"></div>
    <div class="home-content">
      <h1 class="home-title">TYPE TOWER</h1>
      <button id="startButton" class="home-start-button" type="button">START</button>
    </div>
  </section>

  <section data-screen="select" hidden>
    <video class="select-bg-video" autoplay muted loop playsinline>
      <source src="assets/videos/menu-bg.mp4" type="video/mp4">
    </video>

    <div class="tower-select">
      <article class="tower-option">
        <div class="tower-image tower-kanji">漢字の塔</div>
        <button data-mode="kanji">この塔に挑戦</button>
      </article>
      <article class="tower-option">
        <div class="tower-image tower-eiyaku">英訳の塔</div>
        <button data-mode="eiyaku">この塔に挑戦</button>
      </article>
      <article class="tower-option">
        <div class="tower-image tower-wayaku">和訳の塔</div>
        <button data-mode="wayaku">この塔に挑戦</button>
      </article>
    </div>
  </section>

  <section data-screen="settings" hidden>
    <video class="settings-bg-video" autoplay muted loop playsinline>
      <source src="assets/videos/menu-bg.mp4" type="video/mp4">
    </video>
    <div class="settings-shade" aria-hidden="true"></div>

    <div class="game-settings">
      <button id="settingsBackButton" class="settings-back" type="button">← 塔選択へ</button>
      <p class="settings-kicker">GAME SETTING</p>
      <h1 id="settingsTitle">漢字の塔</h1>
      <p id="settingsHint" class="settings-hint">日本語を学ぶ人向け・漢字の読みを練習</p>

      <div class="setting-row">
        <div class="setting-label">
          <strong>MODE</strong>
          <span>遊び方</span>
        </div>
        <div class="setting-options" role="group" aria-label="ゲームモード">
          <button class="setting-choice is-selected" type="button" data-game-mode="normal" aria-pressed="true">通常</button>
          <button class="setting-choice" type="button" data-game-mode="endless" aria-pressed="false">ENDLESS</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">
          <strong>LEVEL</strong>
          <span>問題の難しさ</span>
        </div>
        <div class="setting-options" role="group" aria-label="問題レベル">
          <button class="setting-choice" type="button" data-level="1" aria-pressed="false">Lv.1 基礎</button>
          <button class="setting-choice is-selected" type="button" data-level="2" aria-pressed="true">Lv.2 標準</button>
          <button class="setting-choice" type="button" data-level="3" aria-pressed="false">Lv.3 発展</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label">
          <strong>TIME</strong>
          <span>制限時間</span>
        </div>
        <div class="setting-options" role="group" aria-label="制限時間">
          <button class="setting-choice" type="button" data-time="60" aria-pressed="false">60秒</button>
          <button class="setting-choice is-selected" type="button" data-time="90" aria-pressed="true">90秒</button>
          <button class="setting-choice" type="button" data-time="120" aria-pressed="false">120秒</button>
          <button class="setting-choice" type="button" data-time="none" aria-pressed="false">無制限</button>
        </div>
      </div>

      <button id="playButton" class="game-start-button" type="button">START</button>
    </div>
  </section>

  <section data-screen="game" hidden>
    <img class="game-screen-bg" src="assets/images/sky.jpg" alt="" aria-hidden="true">
    <aside class="floor-rail">
      <span data-floor="10">10F</span><span data-floor="9">9F</span>
      <span data-floor="8">8F</span><span data-floor="7">7F</span>
      <span data-floor="6">6F</span><span data-floor="5">5F</span>
      <span data-floor="4">4F</span><span data-floor="3">3F</span>
      <span data-floor="2">2F</span><span data-floor="1">1F</span>
      <div class="timer-box">TIME <strong id="timeText">90</strong></div>
    </aside>
    <button id="gameBackButton" class="back-button" type="button">設定へ戻る</button>
    <button id="endlessEndButton" class="endless-end-button" type="button" hidden>終了してRESULT</button>
    <div class="game-info-bar" aria-live="polite">
      <span id="modeText">NORMAL</span>
      <span id="levelText">Lv.2</span>
    </div>
    <div class="game-stage">
      <div id="towerScrollTrack" class="tower-scroll-track" aria-hidden="true">
        <div class="tower-frame"><img class="game-stage-bg" alt=""></div>
        <div class="tower-frame"><img id="gameStageBg" class="game-stage-bg" alt=""></div>
        <div class="tower-frame"><img class="game-stage-bg" alt=""></div>
      </div>
      <div class="game-hud">
        <div class="hud-top"><div><strong id="floorText">1F</strong></div></div>
        <div id="questionCard" class="question-card">
          <p>読みを入力</p>
          <h2 id="questionText">読み込み中…</h2>
        </div>
        <form id="answerForm" class="answer-form">
          <input id="answerInput" type="text" autocomplete="off" placeholder="答えを入力してEnter">
        </form>
        <p id="judgeMessage" class="judge-message" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section data-screen="result" hidden>
    <div class="result-panel">
      <p class="result-kicker">RESULT</p>
      <h1 id="resultTitle">漢字の塔 CLEAR</h1>
      <p id="resultSettingText" class="result-setting-text"></p>
      <div class="result-grid">
        <div><span>正解</span><strong id="resultCorrect">0</strong></div>
        <div><span>MISS</span><strong id="resultMiss">0</strong></div>
        <div><span>正答率</span><strong id="resultAccuracy">0%</strong></div>
        <div><span>TIME</span><strong id="resultTime">0.0s</strong></div>
      </div>
      <div class="result-actions">
        <button id="retryButton" type="button">もう一度挑戦</button>
        <button id="resultBackButton" type="button">塔選択へ戻る</button>
      </div>
    </div>
  </section>

  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
